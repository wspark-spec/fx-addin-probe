<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FX Pages probe</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body { font: 13px -apple-system, Segoe UI, sans-serif; margin: 12px; }
  button { padding: 6px 12px; }
  pre { white-space: pre-wrap; background: #f4f4f4; padding: 8px; }
</style>
</head>
<body>
<h3>FX Pages — load probe (GitHub Pages)</h3>
<p id="status">Office.js loading…</p>
<button id="read" disabled>Read workbook (read-only)</button>
<button id="write" disabled>Write test (WestPro AL)</button>
<button id="revert" disabled>Revert test cell</button>
<pre id="out"></pre>
<script>
const out = (s) => document.getElementById('out').textContent += s + '\n';
Office.onReady((info) => {
  document.getElementById('status').textContent =
    `Loaded. host=${info.host} platform=${info.platform} ExcelApi1.10=${Office.context.requirements.isSetSupported('ExcelApi', '1.10')}`;
  document.getElementById('read').disabled = false;
  // merged/spill guards need ExcelApi 1.13 / 1.12
  document.getElementById('write').disabled = !Office.context.requirements.isSetSupported('ExcelApi', '1.13');
  document.getElementById('revert').disabled = false;
});
let fxtest = null;  // in-memory: keep this pane open between write and revert
try { fxtest = JSON.parse(localStorage.getItem('fxtest') || 'null'); } catch (e) {}
const keep = (v) => { fxtest = v; try { v ? localStorage.setItem('fxtest', JSON.stringify(v)) : localStorage.removeItem('fxtest'); } catch (e) {} };
const westpro = (ctx) => ctx.workbook.worksheets.getItem('WestPro');
// Write one marker into the first WestPro AL cell (row >= 4, within used range)
// that is empty, formula-free, not merged and not part of a spill.
document.getElementById('write').onclick = async () => {
  if (fxtest) return out(`BLOCKED: revert ${fxtest.addr} first`);
  const btn = document.getElementById('write');
  btn.disabled = true;
  try {
    await Excel.run(async (ctx) => {
      ctx.workbook.load('name');
      const ws = westpro(ctx);
      const used = ws.getUsedRange();
      used.load('rowIndex,rowCount');
      await ctx.sync();
      if (!ctx.workbook.name.startsWith('TEST COPY')) return out('BLOCKED: not a TEST COPY workbook: ' + ctx.workbook.name);
      const lastRow = used.rowIndex + used.rowCount;
      if (lastRow < 4) return out('no data rows');
      const col = ws.getRange(`AL4:AL${lastRow}`);
      col.load('formulas');
      await ctx.sync();
      for (let i = 0; i < col.formulas.length; i++) {
        if (col.formulas[i][0] !== '') continue;
        const addr = `AL${i + 4}`;
        const cell = ws.getRange(addr);
        const merged = cell.getMergedAreasOrNullObject();
        const spill = cell.getSpillParentOrNullObject();
        merged.load('address');
        spill.load('address');
        cell.load('formulas');
        await ctx.sync();
        if (!merged.isNullObject || !spill.isNullObject || cell.formulas[0][0] !== '') continue;
        const marker = 'FXTEST ' + new Date().toISOString();
        keep({addr, marker});
        out(`PENDING WestPro!${addr} = ${marker}`);
        cell.values = [[marker]];
        await ctx.sync();
        cell.load('values');
        await ctx.sync();
        return out(`WROTE WestPro!${addr} = ${cell.values[0][0]}`);
      }
      out('no eligible empty cell in AL');
    });
  } catch (e) {
    out('ERROR: ' + e);
  } finally {
    btn.disabled = false;
  }
};
document.getElementById('revert').onclick = async () => {
  try {
    const t = fxtest;
    if (!t) return out('nothing to revert');
    await Excel.run(async (ctx) => {
      const cell = westpro(ctx).getRange(t.addr);
      cell.load('values');
      await ctx.sync();
      if (cell.values[0][0] !== t.marker) return out(`SKIP ${t.addr}: value changed to ${cell.values[0][0]}`);
      cell.clear(Excel.ClearApplyTo.contents);
      await ctx.sync();
      cell.load('formulas');
      await ctx.sync();
      keep(null);
      out(`REVERTED WestPro!${t.addr} -> ${JSON.stringify(cell.formulas[0][0])}`);
    });
  } catch (e) {
    out('ERROR: ' + e);
  }
};
document.getElementById('read').onclick = async () => {
  try {
    await Excel.run(async (ctx) => {
      const sheets = ctx.workbook.worksheets;
      sheets.load('items/name');
      await ctx.sync();
      out('sheets: ' + sheets.items.map((s) => s.name).join(' | '));
      const ws = sheets.items.find((s) => /westpro/i.test(s.name));
      if (!ws) return out('WestPro sheet not found');
      const hdr = ws.getRange('A1:AN3');
      hdr.load('values');
      await ctx.sync();
      out(`${ws.name} C/AL/AM/AN rows 1-3: ` +
          JSON.stringify(hdr.values.map((r) => [r[2], r[37], r[38], r[39]])));
    });
  } catch (e) {
    out('ERROR: ' + e);
  }
};
</script>
</body>
</html>
